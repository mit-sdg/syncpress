name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check design, generated artifacts, and types
        run: bun run check
      - name: Run the complete test suite
        run: bun test
      - name: Build and inspect the npm package
        run: npm pack --dry-run
